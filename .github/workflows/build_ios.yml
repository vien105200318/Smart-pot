name: Flutter iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      # All plugins are Swift Packages (SPM) - no CocoaPods/Podfile needed.
      # Do NOT commit ios/Podfile: it triggers a CocoaPods+SPM hybrid that
      # fails with "sandbox is not in sync with the Podfile.lock".

      - name: 🆙 Patch iOS build settings (deployment target + signing team)
        run: |
          # iOS Deployment Target 15.0 (SPM build reads this from the pbxproj)
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj
          # Placeholder DEVELOPMENT_TEAM: 'flutter build ios --no-codesign' still
          # requires a team in project.pbxproj even though signing is disabled.
          # The value is never used because --no-codesign sets CODE_SIGNING_ALLOWED=NO.
          perl -i -pe 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.example\.smartPot;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = 0000000000;/g' ios/Runner.xcodeproj/project.pbxproj

      # Build iOS với cờ --release
      - name: 🛠️ Build iOS App
        run: flutter build ios --release --no-codesign

      # Kiểm tra và đóng gói
      - name: 📦 Package into Unsigned IPA
        run: |
          mkdir -p Payload
          # Tìm file .app trong thư mục build để copy cho chính xác
          APP_PATH=$(find build/ios -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr smart_pot_unsigned.ipa Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-pot-ios-unsigned
          path: smart_pot_unsigned.ipa
          retention-days: 7